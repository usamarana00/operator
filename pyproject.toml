[project]
name = "freelance-agent"
version = "0.1.0"
description = "Multi-agent AI system for freelance project management"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "langchain==0.3.7",
    "langchain-openai==0.2.6",
    "langchain-community==0.3.7",
    "langchain-text-splitters==0.3.2",
    "langchain-chroma==0.1.4",
    "langgraph==0.2.38",
    "chromadb==0.5.18",
    "pypdf==5.1.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "tavily-python==0.5.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "jwt>=1.4.0",
    "asyncpg==0.29.0",
    "pgvector==0.3.2",
    "pyjwt==2.9.0",
    "cryptography==43.0.3",
    "boto3==1.35.0",
    "slowapi==0.1.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
